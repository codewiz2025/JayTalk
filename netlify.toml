[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Giphy key is meant for the browser (VITE_*). Omit from fail-the-build scan.
  SECRETS_SCAN_OMIT_KEYS = "VITE_GIPHY_API_KEY,RESEND_FROM,BETTER_AUTH_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env,.env.example,README.md,.vercel/**"